<form (ngSubmit)="onSubmit()">
  <input
    type="text"
    [formControl]="titleControl"
    name="title"
    placeholder="New Task"
  />
  <button type="submit" [disabled]="adding" [attr.aria-busy]="adding">
    <span class="spinner" *ngIf="adding" aria-hidden="true"></span>
    {{ adding ? 'Adicionando...' : 'Adicionar' }}
  </button>

  <p class="field-error" *ngIf="errorMessage as message">{{ message }}</p>
  <p class="form-status" *ngIf="adding" role="status">Adicionando task...</p>
</form>
