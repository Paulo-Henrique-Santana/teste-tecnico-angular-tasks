<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <label class="sr-only" for="task-title" i18n="@@taskForm.label">Título da tarefa</label>
  <input
    id="task-title"
    type="text"
    formControlName="title"
    placeholder="Nova tarefa"
    i18n-placeholder="@@taskForm.placeholder"
    [attr.aria-invalid]="errorMessage() ? true : null"
    [attr.aria-describedby]="errorMessage() ? 'task-title-error' : null"
  />
  <button type="submit" [disabled]="adding()" [attr.aria-busy]="adding()">
    @if (adding()) {
      <span class="spinner" aria-hidden="true"></span>
      <ng-container i18n="@@taskForm.submit.loading">Adicionando...</ng-container>
    } @else {
      <ng-container i18n="@@taskForm.submit">Adicionar</ng-container>
    }
  </button>

  @if (errorMessage(); as message) {
    <p id="task-title-error" class="field-error" role="alert">{{ message }}</p>
  }
  @if (adding()) {
    <p class="form-status" role="status" i18n="@@taskForm.status.adding">Adicionando tarefa...</p>
  }
</form>
