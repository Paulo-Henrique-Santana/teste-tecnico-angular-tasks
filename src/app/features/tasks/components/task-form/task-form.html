<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <input
    type="text"
    formControlName="title"
    placeholder="Nova tarefa"
    i18n-placeholder="@@taskForm.placeholder"
  />
  <button type="submit" [disabled]="adding()" [attr.aria-busy]="adding()">
    @if (adding()) {
      <span class="spinner" aria-hidden="true"></span>
      <ng-container i18n="@@taskForm.submit.loading">Adicionando...</ng-container>
    } @else {
      <ng-container i18n="@@taskForm.submit">Adicionar</ng-container>
    }
  </button>

  @if (errorMessage(); as message) {
    <p class="field-error">{{ message }}</p>
  }
  @if (adding()) {
    <p class="form-status" role="status" i18n="@@taskForm.status.adding">Adicionando tarefa...</p>
  }
</form>
