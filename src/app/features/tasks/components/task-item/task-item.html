<li [class.completed]="task().completed">
  <input
    type="checkbox"
    [id]="checkboxId()"
    (change)="onToggle()"
    [checked]="task().completed"
  />
  <label [for]="checkboxId()">{{ task().title }}</label>
  <button type="button" (click)="onRemove()" [attr.aria-label]="removeAriaLabel()">
    <ng-container i18n="@@taskItem.remove">Remover</ng-container>
  </button>
</li>
